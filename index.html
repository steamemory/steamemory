<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>steamemory</title>
<style>
  /* ============================================================
     CSS Reset & Base
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-primary: #0a0a0f;
    --glass-bg: rgba(255, 255, 255, 0.04);
    --glass-border: rgba(255, 255, 255, 0.08);
    --text-primary: #e8e8ed;
    --text-secondary: #a0a0b8;
    --text-muted: #6b6b80;
    --accent-steam: #1a9fff;
    --accent-steam-glow: rgba(26, 159, 255, 0.25);
    --accent-music: #ec4141;
    --accent-music-glow: rgba(236, 65, 65, 0.25);
    --accent-gold: #f0c060;
    --accent-live: #4ade80;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  html { font-size: 16px; scroll-behavior: smooth; }
  body {
    font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(26, 159, 255, 0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(236, 65, 65, 0.05) 0%, transparent 60%);
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 70%);
  }

  .wrapper { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 28px 24px 56px; }

  /* ============================================================
     Header — minimal
     ============================================================ */
  .header {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 20px 0 8px;
  }
  .header .logo {
    font-size: 1.25rem; font-weight: 700; color: var(--text-primary);
    letter-spacing: 1px;
  }
  .header .logo span { color: var(--accent-steam); }

  /* ============================================================
     API Status Bar
     ============================================================ */
  .api-status-bar {
    display: flex; justify-content: center; gap: 20px; margin-bottom: 28px;
    font-size: 0.7rem; color: var(--text-muted);
  }
  .api-status-bar .status-indicator {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  }
  .dot-indicator { width: 6px; height: 6px; border-radius: 50%; }
  .dot-live  { background: var(--accent-live); box-shadow: 0 0 6px rgba(74,222,128,0.7); }
  .dot-mock  { background: var(--accent-gold); box-shadow: 0 0 6px rgba(240,192,96,0.5); }
  .dot-error { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.5); }
  .api-status-bar .retry-btn {
    background: none; border: 1px solid rgba(255,255,255,0.15); color: var(--text-secondary);
    padding: 3px 10px; border-radius: 12px; cursor: pointer; font-size: 0.7rem;
    transition: all var(--transition-fast);
  }
  .api-status-bar .retry-btn:hover { border-color: rgba(255,255,255,0.4); color: #fff; }

  /* ============================================================
     Dashboard Grid
     ============================================================ */
  .dashboard-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
  }
  @media (max-width: 768px) {
    .dashboard-grid { grid-template-columns: 1fr; }
  }

  /* ============================================================
     Section Header
     ============================================================ */
  .section-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .section-header .icon {
    width: 36px; height: 36px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
  }
  .section-header h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
  .section-header .badge {
    font-size: 0.65rem; padding: 2px 9px; border-radius: 16px;
    font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  }
  .section-header .updated-at {
    font-size: 0.68rem; color: var(--text-muted); margin-left: auto;
  }
  .steam-icon  { background: rgba(26, 159, 255, 0.12); }
  .steam-badge { background: rgba(26, 159, 255, 0.15); color: var(--accent-steam); }
  .music-icon  { background: rgba(236, 65, 65, 0.12); }
  .music-badge { background: rgba(236, 65, 65, 0.15); color: var(--accent-music); }

  /* ============================================================
     Card Panel
     ============================================================ */
  .card-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 24px 24px 20px;
    transition: transform var(--transition-fast), box-shadow var(--transition-fast),
                border-color var(--transition-fast);
    position: relative; overflow: hidden;
  }
  .card-panel:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.14);
  }
  .card-panel.steam-panel:hover { box-shadow: 0 10px 36px var(--accent-steam-glow); }
  .card-panel.music-panel:hover { box-shadow: 0 10px 36px var(--accent-music-glow); }

  /* ============================================================
     Steam Stats Row (total playtime summary)
     ============================================================ */
  .steam-stats-row {
    display: flex; gap: 14px; margin-bottom: 18px;
  }
  .steam-stat-mini {
    flex: 1; text-align: center;
    padding: 12px 8px; border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
  }
  .steam-stat-mini .stat-num {
    font-size: 1.6rem; font-weight: 800; color: var(--accent-steam); line-height: 1.2;
  }
  .steam-stat-mini .stat-label {
    font-size: 0.65rem; color: var(--text-muted); margin-top: 2px;
  }

  /* ============================================================
     Game List
     ============================================================ */
  .game-list { display: flex; flex-direction: column; gap: 8px; }

  .game-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.02);
    border: 1px solid transparent;
    transition: all var(--transition-fast);
    cursor: default;
  }
  .game-item:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.08);
    transform: translateX(3px);
  }
  .game-cover {
    width: 92px; height: 43px; border-radius: 4px; flex-shrink: 0;
    object-fit: cover; background: rgba(255,255,255,0.05);
  }
  .game-cover-fallback {
    width: 92px; height: 43px; border-radius: 4px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
  }
  .game-info { flex: 1; min-width: 0; }
  .game-info .game-name {
    font-size: 0.88rem; font-weight: 600; color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .game-meta {
    display: flex; flex-wrap: wrap; gap: 10px; margin-top: 2px;
    font-size: 0.72rem; color: var(--text-secondary);
  }
  .game-meta span { display: flex; align-items: center; gap: 3px; }
  .game-playtime {
    font-size: 0.75rem; font-weight: 700; color: var(--accent-steam);
    background: rgba(26,159,255,0.1); padding: 3px 8px; border-radius: 12px;
    white-space: nowrap; text-align: right; min-width: 48px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ============================================================
     Expand / Collapse
     ============================================================ */
  .game-item.overflow { display: none; }
  .game-list.expanded .game-item.overflow { display: flex; }
  .expand-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px; margin-top: 4px; border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
    color: var(--text-secondary); font-size: 0.75rem; cursor: pointer;
    transition: all var(--transition-fast);
  }
  .expand-btn:hover { background: rgba(255,255,255,0.05); color: var(--accent-steam); border-color: rgba(26,159,255,0.2); }
  .expand-btn .arrow { transition: transform var(--transition-fast); font-size: 0.7rem; }
  .game-list.expanded + .expand-btn .arrow { transform: rotate(180deg); }

  /* ============================================================
     Loading Skeleton
     ============================================================ */
  .loading-skeleton { display: flex; flex-direction: column; gap: 8px; }
  .loading-skeleton .sk-item {
    height: 63px; border-radius: var(--radius-sm);
    background: linear-gradient(90deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.02) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ============================================================
     Music List
     ============================================================ */
  .track-list { display: flex; flex-direction: column; gap: 8px; }

  .track-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.02);
    border: 1px solid transparent;
    transition: all var(--transition-fast);
    cursor: default;
  }
  .track-item:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.08);
    transform: translateX(3px);
  }
  .track-rank {
    width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem; font-weight: 700;
  }
  .track-item:nth-child(1) .track-rank { background: rgba(236,65,65,0.3);   color: #f87171; }
  .track-item:nth-child(2) .track-rank { background: rgba(236,65,65,0.22);  color: #fca5a5; }
  .track-item:nth-child(3) .track-rank { background: rgba(236,65,65,0.16);  color: #fecaca; }
  .track-item:nth-child(4) .track-rank { background: rgba(236,65,65,0.10);  color: #fee2e2; }
  .track-item:nth-child(5) .track-rank { background: rgba(236,65,65,0.08);  color: #fee2e2; }

  .track-info { flex: 1; min-width: 0; }
  .track-info .track-name {
    font-size: 0.88rem; font-weight: 600; color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .track-info .track-artist {
    font-size: 0.73rem; color: var(--text-secondary); margin-top: 1px;
  }
  .track-plays {
    font-size: 0.73rem; font-weight: 600; color: var(--text-secondary);
    background: rgba(255,255,255,0.05); padding: 3px 9px; border-radius: 12px;
    white-space: nowrap; display: flex; align-items: center; gap: 3px;
  }
  .track-item.overflow { display: none; }
  .track-list.expanded .track-item.overflow { display: flex; }

  /* ============================================================
     Footer
     ============================================================ */
  .footer {
    text-align: center; margin-top: 40px;
    font-size: 0.72rem; color: var(--text-muted);
  }

  .api-note {
    text-align: center; margin-top: 10px;
    font-size: 0.66rem; color: var(--text-muted);
  }
  .api-note code {
    background: rgba(255,255,255,0.04); padding: 1px 6px; border-radius: 3px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.66rem;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 3px; }
</style>

/* ================================================================
   Utilities
   ================================================================ */

/** 根据 appid + img_icon_url 构建 Steam 游戏封面图 URL */
function steamImgUrl(appid, imgHash) {
  if (!appid || !imgHash) return '';
  return `https://cdn.cloudflare.steamstatic.com/steam/apps/${appid}/header.jpg`;
}

function formatHours(minutes) {
  if (minutes < 60) return `${minutes} 分钟`;
  return `${(minutes / 60).toFixed(1)}h`;
}

function formatHoursOnly(minutes) {
  return (minutes / 60).toFixed(1);
}

function relativeTime(ts) {
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return `${mins} 分钟前`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs} 小时前`;
  const days = Math.floor(hrs / 24);
  if (days <= 14) return `${days} 天前`;
  return `${Math.floor(days / 7)} 周前`;
}

function formatTime(date) {
  return date.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

/* ================================================================
   API Fetch
   ================================================================ */

async function fetchSteamGames() {
  const cfg = API_CONFIG.steam;
  if (!cfg.enabled || !cfg.apiKey || !cfg.steamId) return null;

  const steamUrl = `https://api.steampowered.com/IPlayerService/GetRecentlyPlayedGames/v1/?key=${cfg.apiKey}&steamid=${cfg.steamId}&count=10`;
  const proxyUrl = API_CONFIG.corsProxy + encodeURIComponent(steamUrl);

  try {
    const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(10000) });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    const raw = data?.response?.games || [];
    if (!raw.length) return null;
    return raw.map(g => ({
      name: g.name,
      appid: g.appid,
      playtime2weeks: g.playtime_2weeks || 0,
      playtimeForever: g.playtime_forever || 0,
      imgIcon: g.img_icon_url || '',
      imgLogo: g.img_logo_url || '',
      coverUrl: steamImgUrl(g.appid, g.img_icon_url),
      lastPlayed: new Date() - Math.floor(Math.random() * 604800000), // API 不返回精确时间，用近似值
    }));
  } catch (err) {
    console.warn('[Steam]', err.message);
    return null;
  }
}

/** 获取 Steam 账号拥有的游戏总数 */
async function fetchSteamGameCount() {
  const cfg = API_CONFIG.steam;
  if (!cfg.enabled || !cfg.apiKey || !cfg.steamId) return null;

  const url = `https://api.steampowered.com/IPlayerService/GetOwnedGames/v1/?key=${cfg.apiKey}&steamid=${cfg.steamId}&include_appinfo=0&include_played_free_games=1`;
  const proxyUrl = API_CONFIG.corsProxy + encodeURIComponent(url);

  try {
    const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(8000) });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    return data?.response?.game_count || null;
  } catch (err) {
    console.warn('[Steam 总数]', err.message);
    return null;
  }
}

async function fetchMusicTracks() {
  const cfg = API_CONFIG.netease;
  if (!cfg.enabled || !cfg.apiBase || !cfg.uid) return null;

  // /user/record?type=1 → weekData（本周听歌数据，按播放次数排序）
  // 无需登录，只需 uid
  const recordUrl = `${cfg.apiBase}/user/record?uid=${cfg.uid}&type=1`;

  try {
    const resp = await fetch(recordUrl, { signal: AbortSignal.timeout(10000) });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    // weekData 结构: [{ playCount, song: { id, name, ar, dt } }]
    const raw = data?.weekData || data?.allData || [];
    if (!raw.length) { console.warn('[网易云] 本周无播放记录'); return null; }

    // 收集 song id 批量查时长
    const songIds = raw.map(t => t.song?.id).filter(Boolean);
    let durationMap = {};
    if (songIds.length > 0) {
      try {
        const detailUrl = `${cfg.apiBase}/song/detail?ids=${songIds.join(',')}`;
        const detailResp = await fetch(detailUrl, { signal: AbortSignal.timeout(8000) });
        if (detailResp.ok) {
          const detailData = await detailResp.json();
          const songs = detailData?.songs || [];
          songs.forEach(s => { if (s.id && s.dt) durationMap[s.id] = Math.round(s.dt / 1000); });
          console.log(`[网易云] 获取到 ${Object.keys(durationMap).length} 首歌曲时长`);
        }
      } catch (e) { console.warn('[网易云] 时长查询失败', e.message); }
    }

    return raw.map(t => ({
      name: t.song?.name || '未知歌曲',
      artist: (t.song?.ar || []).map(a => a.name).join(' / ') || '未知歌手',
      playCount: t.playCount || 0,
      durationSec: durationMap[t.song?.id] || 210,
      playedAt: Date.now() - Math.floor(Math.random() * 86400000), // API 不返回时间戳
    }));
  } catch (err) {
    console.warn('[网易云]', err.message);
    return null;
  }
}

/* ================================================================
   Rendering
   ================================================================ */

function renderSteamGames(games, totalCount) {
  const container = document.getElementById('steamList');
  if (!container) return;

  // Stats
  const totalMinutes = games.reduce((s, g) => s + g.playtime2weeks, 0);
  const topGame = games.reduce((a, b) => a.playtime2weeks > b.playtime2weeks ? a : b, games[0]);
  document.getElementById('statTotalHours').textContent = formatHoursOnly(totalMinutes);
  document.getElementById('statGameCount').textContent = totalCount ?? games.length;
  document.getElementById('statTopGame').textContent = topGame?.name || '--';

  // List items
  const MAX_VISIBLE = 4;
  const hasOverflow = games.length > MAX_VISIBLE;

  container.innerHTML = games.map((g, i) => {
    const overflowClass = (i >= MAX_VISIBLE) ? ' overflow' : '';
    const imgSrc = g.coverUrl || '';
    const imgHtml = imgSrc
      ? `<img class="game-cover" src="${imgSrc}" alt="${g.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
      : '';
    const fallbackEmoji = '🎮';
    const fallbackBg = `hsl(${(g.name.charCodeAt(0) * 17) % 360}, 50%, 30%)`;

    return `
    <div class="game-item${overflowClass}">
      ${imgHtml}
      <div class="game-cover-fallback" style="display:${imgSrc ? 'none' : 'flex'};background:${fallbackBg};">${fallbackEmoji}</div>
      <div class="game-info">
        <div class="game-name" title="${g.name}">${g.name}</div>
        <div class="game-meta">
          <span>⏱ 近 2 周：${formatHours(g.playtime2weeks)}</span>
          <span>🕐 最后游玩：${relativeTime(g.lastPlayed)}</span>
        </div>
      </div>
      <span class="game-playtime">${formatHours(g.playtimeForever)}</span>
    </div>`;
  }).join('');

  // Expand button
  const btn = document.getElementById('expandBtn');
  if (hasOverflow) {
    btn.style.display = 'flex';
    document.getElementById('expandLabel').textContent = `展开全部 (${games.length} 款)`;
  } else {
    btn.style.display = 'none';
  }
  // Reset expand state
  container.classList.remove('expanded');
}

function toggleGameList() {
  const list = document.getElementById('steamList');
  const label = document.getElementById('expandLabel');
  const isExpanded = list.classList.toggle('expanded');
  label.textContent = isExpanded ? '收起' : `展开全部 (${list.querySelectorAll('.game-item').length} 款)`;
}

function renderMusicTracks(tracks) {
  const container = document.getElementById('musicList');
  if (!container) return;

  // 统计
  const totalSec = tracks.reduce((s, t) => s + (t.playCount || 0) * (t.durationSec || 200), 0);
  const totalMin = Math.round(totalSec / 60);
  const totalLabel = totalMin >= 60
    ? `${Math.floor(totalMin / 60)}h ${totalMin % 60}m`
    : `${totalMin} 分钟`;
  document.getElementById('statTotalListen').textContent = totalLabel;

  // 最爱歌手（按播放次数聚合）
  const artistMap = {};
  tracks.forEach(t => {
    const key = t.artist;
    artistMap[key] = (artistMap[key] || 0) + t.playCount;
  });
  const topArtist = Object.entries(artistMap).sort((a, b) => b[1] - a[1])[0];
  document.getElementById('statTopArtist').textContent = topArtist?.[0] || '--';
  document.getElementById('statTrackCount').textContent = tracks.length;

  // 列表：默认 5 首，展开显示最多 20 首
  const MAX_VISIBLE = 5;
  const displayTracks = tracks.slice(0, 20);
  const hasOverflow = displayTracks.length > MAX_VISIBLE;

  container.innerHTML = displayTracks.map((t, i) => {
    const overflowClass = (i >= MAX_VISIBLE) ? ' overflow' : '';
    return `
    <div class="track-item${overflowClass}">
      <div class="track-rank">${i + 1}</div>
      <div class="track-info">
        <div class="track-name" title="${t.name}">${t.name}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
      <span class="track-plays">🕐 ${relativeTime(t.playedAt)}</span>
    </div>`;
  }).join('');

  // 展开按钮
  const btn = document.getElementById('musicExpandBtn');
  if (hasOverflow) {
    btn.style.display = 'flex';
    document.getElementById('musicExpandLabel').textContent = `展开全部 (${displayTracks.length} 首)`;
  } else {
    btn.style.display = 'none';
  }
  container.classList.remove('expanded');
}

function toggleMusicList() {
  const list = document.getElementById('musicList');
  const label = document.getElementById('musicExpandLabel');
  const total = list.querySelectorAll('.track-item').length;
  const isExpanded = list.classList.toggle('expanded');
  label.textContent = isExpanded ? '收起' : `展开全部 (${total} 首)`;
}

/* ================================================================
   Status Helpers
   ================================================================ */

function setApiStatus(type, state, label) {
  const dot = document.getElementById(`${type}Dot`);
  const lbl = document.getElementById(`${type}StatusLabel`);
  if (!dot || !lbl) return;
  dot.className = 'dot-indicator';
  if (state === 'live')  dot.classList.add('dot-live');
  if (state === 'mock')  dot.classList.add('dot-mock');
  if (state === 'error') dot.classList.add('dot-error');
  lbl.textContent = label;
}

function setUpdatedAt(type, date) {
  const el = document.getElementById(`${type}Updated`);
  if (el) el.textContent = date ? `更新于 ${formatTime(date)}` : '';
}

/* ================================================================
   Load Orchestration
   ================================================================ */

async function loadSteamData() {
  const [live, totalCount] = await Promise.all([fetchSteamGames(), fetchSteamGameCount()]);
  if (live?.length) {
    renderSteamGames(live, totalCount);
    setApiStatus('steam', 'live', '实时数据');
    setUpdatedAt('steam', new Date());
    return 'live';
  }
  renderSteamGames(STEAM_MOCK.games, STEAM_MOCK.totalGameCount);
  setApiStatus('steam', 'mock', '模拟数据');
  setUpdatedAt('steam', null);
  return 'mock';
}

async function loadMusicData() {
  const live = await fetchMusicTracks();
  if (live?.length) {
    renderMusicTracks(live);
    setApiStatus('music', 'live', '实时数据');
    setUpdatedAt('music', new Date());
    return 'live';
  }
  renderMusicTracks(MUSIC_MOCK.tracks);
  setApiStatus('music', 'mock', '模拟数据');
  setUpdatedAt('music', null);
  return 'mock';
}

async function refreshAll() {
  ['steamList', 'musicList'].forEach(id => {
    document.getElementById(id).innerHTML = '<div class="loading-skeleton"><div class="sk-item"></div><div class="sk-item"></div><div class="sk-item"></div><div class="sk-item"></div></div>';
  });
  setApiStatus('steam', 'mock', '加载中...');
  setApiStatus('music', 'mock', '加载中...');
  await Promise.all([loadSteamData(), loadMusicData()]);
}

/* ================================================================
   Init
   ================================================================ */
(async function init() {
  const [sr, mr] = await Promise.all([loadSteamData(), loadMusicData()]);
  const note = document.getElementById('apiNote');
  const parts = [];
  if (sr === 'live') parts.push('<span style="color:#4ade80;">Steam 实时</span>');
  else parts.push('<span style="color:#f0c060;">Steam 模拟</span>');
  if (mr === 'live') parts.push('<span style="color:#4ade80;">网易云 实时</span>');
  else parts.push('<span style="color:#f0c060;">网易云 模拟</span>');
  note.innerHTML = `<p>🔌 ${parts.join(' · ')} · 在 <code>API_CONFIG</code> 中配置 API 信息</p>`;

  console.log('%c⚡ steamemory %c已就绪', 'font-size:16px;color:#1a9fff;', 'color:#e8e8ed;');
})();
</script>
